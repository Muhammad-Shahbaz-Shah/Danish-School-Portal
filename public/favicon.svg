<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Decorative Border -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.6"/>

  <!-- Center Emblem Group -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Crescent & Star Emblem (Symbol of Excellence & Punjab Heritage) -->
    <path d="M 0,-140 A 130,130 0 1 0 110,60 A 100,100 0 1 1 0,-140 Z" fill="url(#goldGrad)"/>
    
    <!-- Rising 5-Point Star -->
    <path d="M 60,-80 L 68,-56 L 93,-56 L 73,-41 L 81,-17 L 60,-31 L 39,-17 L 47,-41 L 27,-56 L 52,-56 Z" fill="url(#goldGrad)"/>

    <!-- Open Book of Knowledge Base -->
    <path d="M -110,70 Q -50,50 0,80 Q 50,50 110,70 L 110,130 Q 50,110 0,140 Q -50,110 -110,130 Z" fill="url(#goldGrad)"/>
    <path d="M -100,82 Q -50,65 -5,92 L -5,132 Q -50,106 -100,118 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 100,82 Q 50,65 5,92 L 5,132 Q 50,106 100,118 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Central Divider -->
    <line x1="0" y1="80" x2="0" y2="140" stroke="#047857" stroke-width="4"/>
  </g>
</svg>
